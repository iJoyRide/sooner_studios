<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
  <defs>
    <!-- Warm light: bright in the middle, fading to nothing at the edge -->
    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#FFD9A0" stop-opacity="0.9" />
      <stop offset="40%"  stop-color="#F2A65A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="250" height="300" fill="#2E2620" />
  <rect y="262" width="250" height="38" fill="#251E19" />
  <circle cx="125" cy="118" r="120" fill="url(#glow)" />
  <line x1="125" y1="140" x2="92" y2="262" fill="none" stroke="#4A3D34" stroke-width="3" stroke-linecap="round" />
  <line x1="125" y1="140" x2="158" y2="262" fill="none" stroke="#4A3D34" stroke-width="3" stroke-linecap="round" />
  <line x1="125" y1="140" x2="125" y2="262" fill="none" stroke="#4A3D34" stroke-width="3" stroke-linecap="round" />
  <rect x="90" y="90" width="70" height="55" rx="2" fill="#FBE3B8" stroke="#E8B878" stroke-width="2" />
</svg>
