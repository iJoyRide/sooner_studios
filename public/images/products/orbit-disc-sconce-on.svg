<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
  <defs>
    <!-- Warm light: bright in the middle, fading to nothing at the edge -->
    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#FFD9A0" stop-opacity="0.9" />
      <stop offset="40%"  stop-color="#F2A65A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Wall: evening tile colour -->
  <rect width="250" height="300" fill="#2E2620" />

  <!-- Glow: light spilling onto the wall -->
  <circle cx="125" cy="130" r="120" fill="url(#glow)" />

  <!-- Wall plate: the small mount behind the lamp -->
  <rect x="117" y="95" width="16" height="30" rx="3" fill="#B8AC9F" />

  <!-- The disc: lit up -->
  <circle cx="125" cy="130" r="48" fill="#FBE3B8" stroke="#E8B878" stroke-width="2" />
</svg>
