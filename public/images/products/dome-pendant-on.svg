<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
  <defs>
    <!-- Warm light: bright in the middle, fading to nothing at the edge -->
    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#FFD9A0" stop-opacity="0.9" />
      <stop offset="40%"  stop-color="#F2A65A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="250" height="300" fill="#2E2620" />
  <circle cx="125" cy="190" r="120" fill="url(#glow)" />
  <line x1="125" y1="0" x2="125" y2="110" fill="none" stroke="#4A3D34" stroke-width="3" stroke-linecap="round" />
  <rect x="119" y="104" width="12" height="10" rx="2" fill="#4A3D34" />
  <path d="M 75 175 A 50 62 0 0 1 175 175 Z" fill="#5A4A3F" />
  <ellipse cx="125" cy="175" rx="48" ry="7" fill="#FBE3B8" stroke="#E8B878" stroke-width="2" />
</svg>
