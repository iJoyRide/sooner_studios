<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
  <defs>
    <!-- Warm light: bright in the middle, fading to nothing at the edge -->
    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#FFD9A0" stop-opacity="0.9" />
      <stop offset="40%"  stop-color="#F2A65A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="250" height="300" fill="#2E2620" />
  <rect y="230" width="250" height="70" fill="#251E19" />
  <circle cx="125" cy="165" r="120" fill="url(#glow)" />
  <rect x="119" y="170" width="12" height="60" fill="#5A4A3F" />
  <ellipse cx="125" cy="228" rx="30" ry="5" fill="#5A4A3F" />
  <path d="M 70 175 A 55 50 0 0 1 180 175 Z" fill="#FBE3B8" stroke="#E8B878" stroke-width="2" />
</svg>
